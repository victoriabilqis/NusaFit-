
name: NusaFit Release APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.13'

      - name: Configure Firebase (optional)
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.NUSAFIT_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            echo "Firebase config absent; sync unavailable."
          fi

      - name: Configure Google Maps key (optional)
        shell: bash
        env:
          MAPS_API_KEY: ${{ secrets.NUSAFIT_MAPS_API_KEY }}
        run: |
          if [ -n "$MAPS_API_KEY" ]; then
            python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path('app/src/main/res/values/strings.xml')
          p.write_text(
              p.read_text().replace(
                  'YOUR_GOOGLE_MAPS_API_KEY',
                  os.environ['MAPS_API_KEY'].strip()
              )
          )
          PY
          else
            echo 'Maps key absent; map tiles may not load.'
          fi

      - name: Build release APK
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NusaFit-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
